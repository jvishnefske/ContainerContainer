# Binary release built by the Nix flake.
#
# A push of tag v<version>, where <version> is the content of nix/version.txt, runs every flake check, builds
# packages.release (containercontainer-<version>-jars.tar.gz) and packages.release-oci (the minimal from-scratch
# image containercontainer-<version>.oci.tar with zstd layers, and containercontainer-<version>.oci.json with its
# sha256, size, manifest digest and layer sizes), rebuilds the jar tarball and the image to confirm the bytes are
# reproducible, verifies the sums and publishes a GitHub Release with all files. workflow_dispatch does all of that
# except publishing (a dry run; the files are kept as a workflow artifact).
#
# Every file in dist/ becomes a release asset and dist/SHA256SUMS covers all of them.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            sandbox = true
      - name: Check that the tag matches nix/version.txt
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(cat nix/version.txt)"
          [ "$TAG" = "$want" ] || { echo "tag $TAG does not match nix/version.txt ($want)" >&2; exit 1; }
      - name: nix flake check
        run: nix flake check -L
      - name: Build the release
        run: nix build -L .#release --out-link result-release
      - name: Build the minimal OCI image assets
        run: nix build -L .#release-oci --out-link result-oci
      - name: Rebuild the release and require identical bytes
        run: nix build -L .#release --rebuild --no-link
      - name: Rebuild the image and require identical bytes
        run: nix build -L .#oci --rebuild --no-link
      - name: Collect and verify the assets
        run: |
          (cd result-release && sha256sum -c SHA256SUMS)
          (cd result-oci && sha256sum -c SHA256SUMS)
          mkdir dist
          cp result-release/*.tar.gz result-oci/*.oci.tar result-oci/*.oci.json dist/
          chmod u+w dist/*
          cd dist
          sha256sum -- *.tar.gz *.oci.tar *.oci.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Verify the assets again
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --verify-tag \
            --title "$TAG" \
            --notes "Built by the Nix flake from $TAG ($GITHUB_SHA). Verify with: sha256sum -c SHA256SUMS. Source: https://github.com/$REPO/tree/$TAG (AGPL-3.0-or-later)."
