# Build the fork with the Nix flake: every flake check (jar set vs. the stock listing, deterministic release
# packing, the WASM plugin builder and its imports check), then the jars and the release tarball.
# Maven dependencies come from the fixed-output derivation pinned by nix/mvn-hash.txt; the build itself is offline.
name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true
      - name: nix flake check
        run: nix flake check -L
      - name: Build the jars and the release tarball
        run: nix build -L .#jars .#release
      - name: Verify the release checksums
        run: cd result-1 && sha256sum -c SHA256SUMS
