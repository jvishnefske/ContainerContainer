# Build the fork with the Nix flake: every flake check (jar set vs. the stock listing, deterministic release
# packing, the WASM plugin builder and its imports check, the minimal image's structure and module set), then the
# jars, the release tarball and the minimal OCI image assets.
# Maven dependencies come from the fixed-output derivation pinned by nix/mvn-hash.txt; the build itself is offline.
name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            sandbox = true
      - name: nix flake check
        run: nix flake check -L
      - name: Build the jars, the release tarball and the minimal OCI image
        run: nix build -L .#jars .#release .#release-oci
      - name: Verify the release checksums
        run: |
          (cd result-1 && sha256sum -c SHA256SUMS)
          (cd result-2 && sha256sum -c SHA256SUMS)
