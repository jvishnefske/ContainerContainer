# Build the fork with JDK 25 and run the full unit test suites of every module the fork changes.
# Dependencies resolve only from Maven Central and JFrog's public jfrog-jars repository (.github/maven/settings.xml).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -s .github/maven/settings.xml --no-transfer-progress

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and install all modules (checkstyle included, tests skipped)
        run: mvn $MAVEN_ARGS -T 1C -DskipTests install
      - name: Keep the built artifacts for the test jobs
        run: tar -C ~/.m2/repository -cf artifactory-m2.tar org/artifactory
      - uses: actions/upload-artifact@v4
        with:
          name: artifactory-m2
          path: artifactory-m2.tar
          retention-days: 3

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module: [backend/core, web/rest, web/rest-ui, web/application]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/download-artifact@v8
        with:
          name: artifactory-m2
      - name: Restore this build's modules into the local Maven repository
        run: mkdir -p ~/.m2/repository && tar -C ~/.m2/repository -xf artifactory-m2.tar
      # Upstream's surefire policy fails the build on any flaky test (failOnFlakeCount=1), so tests are not retried.
      # The one exclusion is upstream's unmodified EmptyTrashServiceLongRunTest (web/rest-ui), which races a sleep
      # against a time budget and fails at random on shared runners; it passes on dedicated hardware.
      - name: Full test suite of ${{ matrix.module }}
        run: >-
          mvn $MAVEN_ARGS test -pl ${{ matrix.module }}
          -Dsurefire.excludesFile=${{ github.workspace }}/.github/surefire-excludes.txt
      - name: Name the report artifact
        if: always()
        id: report
        run: echo "name=surefire-$(echo '${{ matrix.module }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ steps.report.outputs.name }}
          path: ${{ matrix.module }}/target/surefire-reports
          retention-days: 7

  # Rebuild the echo-realm example WASM plugin from source in its pinned Rust image, run its unit tests, and fail
  # unless the module is bit-identical to the committed test fixture (backend/core/src/test/resources/wasm).
  wasm-example:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild echo-realm and compare it with the committed fixture
        run: bash plugins/wasm-examples/echo-realm/build.sh --check
