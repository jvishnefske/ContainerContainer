# Class loading as in the stock image: jars a deployment adds under var/work/artifactory/tomcat/lib (for example a
# JDBC driver) come first, then CATALINA_BASE/lib and CATALINA_HOME/lib (Tomcat, Derby, PostgreSQL).
common.loader="${jf.product.home}/var/work/artifactory/tomcat/lib","${jf.product.home}/var/work/artifactory/tomcat/lib/*.jar","${catalina.base}/lib","${catalina.base}/lib/*.jar","${catalina.home}/lib","${catalina.home}/lib/*.jar"
server.loader=
shared.loader=
# No jar is scanned for TLDs or web fragments (Artifactory needs neither).
tomcat.util.scan.StandardJarScanFilter.jarsToSkip=*.jar
tomcat.util.scan.StandardJarScanFilter.jarsToScan=
tomcat.util.buf.StringCache.byte.enabled=true
