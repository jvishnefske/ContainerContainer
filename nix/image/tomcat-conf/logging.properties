# Tomcat's own logging goes to the console (the container log). Artifactory logs through logback to
# var/log, as configured by var/etc/artifactory/logback.xml.
handlers = java.util.logging.ConsoleHandler
.handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = org.apache.juli.OneLineFormatter
java.util.logging.ConsoleHandler.encoding = UTF-8
org.apache.catalina.startup.Catalina.level = WARNING
org.apache.catalina.startup.DigesterFactory.level = SEVERE
org.apache.catalina.loader.WebappClassLoaderBase.level = SEVERE
