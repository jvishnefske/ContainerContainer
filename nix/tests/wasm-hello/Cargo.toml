[package]
name = "wasm-hello"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Test module for lib.buildWasmPlugin: answers ABI v1 execution steps with a fixed greeting"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
