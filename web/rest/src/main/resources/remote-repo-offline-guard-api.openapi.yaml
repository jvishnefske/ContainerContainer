openapi: 3.0.3
info:
  title: Remote Repo Offline Guard API
  description: |
    Manage the rules that protect Artifactory remote repositories from being pointed at
    unsupported third-party integrations.

    The guard has two enforcement surfaces:
      - **URL writes** (synchronous): repo create and URL-changing repo updates are rejected
        with HTTP 400 when the new URL contains any of the configured substrings.
      - **Background scan** (asynchronous): the cron offlines in-scope repos whose recent
        upstream responses (sampled by the outbound-header audit service) exposed any of the
        configured header names. In `PFW3_ALL`, the scan also offlines on URL match (catching
        repos whose URL became unsupported after a substring was added retroactively). In
        `PFW3_NEW`, URL is **not** considered by the scan — URL enforcement in that mode is
        purely the write-time gate.

    Four modes are supported:
      - `PFW3_OFF`   — guard fully disabled.
      - `PFW3_PROBE` — detection only: logs what enforcement would do, never blocks or
                       offlines anything.
      - `PFW3_NEW`   — URL writes are rejected for every repo (whitelist exempt); the cron
                       offlines only repos created at or after `initEpochMillis` whose
                       upstream headers match. Existing repos and URL-match-via-cron are
                       intentionally left untouched.
      - `PFW3_ALL`   — URL writes are rejected for every repo (whitelist exempt); the cron
                       offlines any repo whose URL or upstream headers match, regardless of
                       creation date.

    The guard only ever drives state in one direction: online → offline. Restoring a
    guard-offlined repo to online is always an explicit admin action. The guard never
    re-onlines a repo on its own — not when triggers stop matching, not when a repo is added
    to the whitelist, not when its URL is changed.
  version: "1.0.0"
  contact:
    name: Hussein Alshqerat

servers:
  - url: http://localhost:8082/artifactory
    description: Local development instance
  - url: https://{instance}.jfrog.io/artifactory
    description: JFrog SaaS
    variables:
      instance:
        default: mycompany

security:
  - basicAuth: []
  - bearerAuth: []
  - apiKey: []

tags:
  - name: Remote Repo Offline Guard
    description: Rules that gate URL writes and auto-offline misbehaving remote repositories

paths:
  /api/system/remoteRepoOfflineTriggers:
    get:
      operationId: getRemoteRepoOfflineTriggers
      summary: Get the current offline-guard triggers
      description: |
        Returns the persisted triggers config (mode, URL substrings, header names, whitelist,
        and the `initEpochMillis` activation stamp when set).
        Requires the caller to be a dashboard user; otherwise responds 403.
      tags: [Remote Repo Offline Guard]
      responses:
        '200':
          description: Triggers retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteRepoOfflineTriggersConfig'
              examples:
                probeDefaults:
                  $ref: '#/components/examples/ProbeDefaults'
                allWithRules:
                  $ref: '#/components/examples/AllWithRules'
                newReposOnly:
                  $ref: '#/components/examples/NewReposOnly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      operationId: updateRemoteRepoOfflineTriggers
      summary: Replace the offline-guard triggers
      description: |
        Persists a new triggers config. The body fully replaces the previous config
        (no partial merge). Returns the persisted config.
        Requires the caller to be a dashboard user; otherwise responds 403.

        Special handling for `initEpochMillis`:
          - When the payload omits `initEpochMillis`, the previously-persisted value (if any)
            is carried forward so rule edits do not reset the new/existing-repo split.
          - On the first transition into `PFW3_NEW` with no persisted value, the server
            auto-stamps `initEpochMillis` to the current server time.
          - An admin-supplied `initEpochMillis` always overrides any previous value.

        Setting `mode=PFW3_OFF` makes the guard inert without removing the rules.
      tags: [Remote Repo Offline Guard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoteRepoOfflineTriggersConfig'
            examples:
              switchToAll:
                summary: Promote rules from PFW3_PROBE to full enforcement
                value:
                  mode: PFW3_ALL
                  urlSubstrings:
                    - "firewall.socket.dev"
                    - "endorlabs.com"
                  headerNames:
                    - "x-socket-decision"
                    - "x-socket-block-reason"
                  whitelistedRepoKeys:
                    - "trusted-mirror"
              switchToNewReposOnly:
                summary: Protect newly-created repos only (server auto-stamps initEpochMillis if omitted)
                value:
                  mode: PFW3_NEW
                  urlSubstrings:
                    - "firewall.socket.dev"
                  headerNames:
                    - "x-socket-decision"
                  whitelistedRepoKeys: []
              switchToNewReposWithExplicitInit:
                summary: Protect repos created at or after an admin-supplied instant
                value:
                  mode: PFW3_NEW
                  urlSubstrings:
                    - "firewall.socket.dev"
                  headerNames:
                    - "x-socket-decision"
                  whitelistedRepoKeys: []
                  initEpochMillis: 1700000000000
              disableGuard:
                summary: Disable the guard without losing the rules
                value:
                  mode: PFW3_OFF
                  urlSubstrings:
                    - "firewall.socket.dev"
                  headerNames: []
                  whitelistedRepoKeys: []
      responses:
        '200':
          description: Triggers updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteRepoOfflineTriggersConfig'
              examples:
                allWithRules:
                  $ref: '#/components/examples/AllWithRules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Username and password (for local development)
    bearerAuth:
      type: http
      scheme: bearer
      description: Artifactory access token
    apiKey:
      type: apiKey
      in: header
      name: X-JFrog-Art-Api
      description: Artifactory API key

  schemas:
    RemoteRepoOfflineTriggersConfig:
      type: object
      description: Triggers config persisted by the offline guard.
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        urlSubstrings:
          type: array
          description: |
            Case-insensitive substrings checked against the remote repo URL. In `PFW3_NEW` and
            `PFW3_ALL`, repo create and URL-changing repo update operations that would point
            at a URL containing any of these substrings are **rejected synchronously** with
            HTTP 400. Additionally in `PFW3_ALL`, the background scan offlines any non-
            whitelisted repo whose URL matches (catching repos whose URL became unsupported
            after a substring was added). In `PFW3_NEW` the scan does not consider URL — URL
            is enforced exclusively at the write-time gate, never retroactively. Whitelisted
            repos are exempt from both surfaces.
          items:
            type: string
          uniqueItems: true
          example:
            - "firewall.socket.dev"
            - "endorlabs.com"
        headerNames:
          type: array
          description: |
            Case-insensitive HTTP header names. When the outbound-header audit service samples
            any of these header names on a repo's upstream response, the background scan flips
            the repo offline on its next tick. In `PFW3_NEW` this applies only to repos whose
            `getCreation()` is at or after `initEpochMillis`. In `PFW3_ALL` it applies to all
            repos. Whitelisted repos are exempt.
          items:
            type: string
          uniqueItems: true
          example:
            - "x-socket-decision"
            - "x-socket-block-reason"
        whitelistedRepoKeys:
          type: array
          description: |
            Remote repo keys fully exempt from the guard: never auto-offlined on headers, and
            URL create/update writes pointing at an unsupported URL are also allowed through.
            If a repo was already offlined by the guard before being added here, it stays
            offline — the whitelist does not auto-restore. Admin must re-online manually.
            Repo keys are case-sensitive (unlike URL/header sets).
          items:
            type: string
          uniqueItems: true
          example:
            - "trusted-mirror"
            - "internal-remote"
        initEpochMillis:
          type: integer
          format: int64
          nullable: true
          description: |
            Epoch milliseconds dividing "existing" repos (created before this instant) from
            "new" repos (created at or after). Used by `PFW3_NEW` to scope the header-driven
            offline action — pre-init repos are left untouched. Auto-stamped on the first
            transition into `PFW3_NEW` when omitted; admin-supplied values are respected and
            preserved across subsequent updates that omit this field. Not consulted in
            `PFW3_OFF`, `PFW3_PROBE`, or `PFW3_ALL`.
          example: 1700000000000

    Mode:
      type: string
      description: |
        Run mode of the offline guard.
        - `PFW3_OFF`   — fully inert.
        - `PFW3_PROBE` — detection only, logs would-be actions, no state changes.
        - `PFW3_NEW`   — URL writes rejected for all repos; the cron offlines repos created
                         at or after `initEpochMillis` whose upstream headers match. URL is
                         not considered by the cron in this mode.
        - `PFW3_ALL`   — URL writes rejected for all repos; the cron offlines any repo whose
                         URL or upstream headers match, regardless of creation date.
      enum: [PFW3_OFF, PFW3_PROBE, PFW3_NEW, PFW3_ALL]
      default: PFW3_PROBE

    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string

  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - status: 400
                message: "Invalid mode value: expected one of PFW3_OFF, PFW3_PROBE, PFW3_NEW, PFW3_ALL"

    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - status: 401
                message: "Authentication required"

    Forbidden:
      description: Caller is not a dashboard user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - status: 403
                message: "Only dashboard users can view remote repo offline triggers"

  examples:
    ProbeDefaults:
      summary: Default config after installation (PFW3_PROBE, seeded Socket/Endor rules, no whitelist)
      value:
        mode: PFW3_PROBE
        urlSubstrings:
          - "firewall.socket.dev"
          - "endorlabs.com"
        headerNames:
          - "x-socket-decision"
          - "x-socket-request-id"
          - "x-socket-block-reason"
          - "x-socket-warn-reason"
          - "x-socket-monitor-reason"
          - "x-socket-unscanned"
        whitelistedRepoKeys: []

    AllWithRules:
      summary: Full enforcement across all repos with a whitelist exemption
      value:
        mode: PFW3_ALL
        urlSubstrings:
          - "firewall.socket.dev"
          - "endorlabs.com"
        headerNames:
          - "x-socket-decision"
          - "x-socket-block-reason"
        whitelistedRepoKeys:
          - "trusted-mirror"
          - "internal-remote"

    NewReposOnly:
      summary: Protect newly-created repos with an explicit activation timestamp
      value:
        mode: PFW3_NEW
        urlSubstrings:
          - "firewall.socket.dev"
        headerNames:
          - "x-socket-decision"
        whitelistedRepoKeys:
          - "trusted-mirror"
        initEpochMillis: 1700000000000
