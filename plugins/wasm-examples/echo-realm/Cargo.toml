[package]
name = "echo-realm"
version = "0.1.0"
edition = "2021"
description = "Insecure example WASM plugin (ABI v1): a demonstration and test fixture only."
license = "Apache-2.0"
publish = false

[[bin]]
name = "echo-realm"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
base64 = "=0.22.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
strip = true
panic = "abort"
incremental = false
